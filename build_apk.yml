name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK with Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: false

      - name: Generate Fresh Flutter Project Structure
        run: |
          mkdir -p temp_lib
          cp -r lib/* temp_lib/
          cp pubspec.yaml temp_pubspec.yaml

          rm -rf android ios linux macos windows web lib pubspec.yaml

          flutter create . --org com.pdfpoint.app --project-name pdf_point --platforms=android

          rm -rf lib/*
          cp -r temp_lib/* lib/
          cp temp_pubspec.yaml pubspec.yaml

      # ---- THE FIX: force INTERNET permission into the freshly generated manifest ----
      # flutter create's default AndroidManifest.xml does NOT include INTERNET
      # permission for release builds (Flutter only auto-injects it for debug/hot-reload).
      # Without this, every network call in a --release APK fails with
      # "SocketException: Failed host lookup", no matter what the code or device does.
      - name: Ensure INTERNET permission and SDK 36
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          echo "----- Final AndroidManifest.xml -----"
          cat "$MANIFEST"

          # Force compileSdk/targetSdk to 36 (file_picker's latest version requires it).
          # Newer Flutter versions generate build.gradle.kts (Kotlin DSL);
          # older ones generate build.gradle (Groovy) — handle both.
          KTS="android/app/build.gradle.kts"
          GROOVY="android/app/build.gradle"

          if [ -f "$KTS" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$KTS"
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' "$KTS"
            echo "----- Patched build.gradle.kts -----"
            cat "$KTS"
          elif [ -f "$GROOVY" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$GROOVY"
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' "$GROOVY"
            echo "----- Patched build.gradle -----"
            cat "$GROOVY"
          fi

          # ---- ANOTHER FIX: some plugins (e.g. flutter_pdfview) publish their own
          # AAR compiled against an old SDK (e.g. android-33), which conflicts with
          # newer transitive dependencies that need SDK 34+. Setting our OWN app's
          # compileSdk (above) does NOT change a plugin's own compileSdk, because
          # each Flutter plugin is built as its own separate Gradle subproject.
          # This appends a root-level override that forces EVERY plugin subproject
          # to compile against SDK 36 too, regardless of what it originally declared.
          ROOT_KTS="android/build.gradle.kts"
          ROOT_GROOVY="android/build.gradle"

          if [ -f "$ROOT_KTS" ]; then
            cat >> "$ROOT_KTS" << 'EOF'

subprojects {
    afterEvaluate {
        if (plugins.hasPlugin("com.android.library")) {
            extensions.configure<com.android.build.gradle.LibraryExtension> {
                compileSdk = 36
            }
        }
    }
}
EOF
            echo "----- Patched root build.gradle.kts -----"
            cat "$ROOT_KTS"
          elif [ -f "$ROOT_GROOVY" ]; then
            cat >> "$ROOT_GROOVY" << 'EOF'

subprojects {
    afterEvaluate { proj ->
        if (proj.plugins.hasPlugin("com.android.library")) {
            proj.android {
                compileSdkVersion 36
            }
        }
    }
}
EOF
            echo "----- Patched root build.gradle -----"
            cat "$ROOT_GROOVY"
          fi

      - name: Force clean everything before building
        run: |
          flutter clean
          rm -rf ~/.gradle/caches
          rm -rf ~/.pub-cache
          rm -rf .dart_tool
          rm -rf build

      - name: Install Dependencies (fresh)
        run: flutter pub get

      - name: Build Release APK (no cached build artifacts)
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
