name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK with Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: false

      - name: Generate Fresh Flutter Project Structure
        run: |
          mkdir -p temp_lib
          cp -r lib/* temp_lib/
          cp pubspec.yaml temp_pubspec.yaml

          rm -rf android ios linux macos windows web lib pubspec.yaml

          flutter create . --org com.pdfpoint.app --project-name pdf_point --platforms=android

          rm -rf lib/*
          cp -r temp_lib/* lib/
          cp temp_pubspec.yaml pubspec.yaml

      - name: Ensure INTERNET permission and Safe SDK 35 Update
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          
          # Safely update compileSdkVersion and targetSdkVersion using flutter's local configuration or gradle fallback
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/flutter.compileSdkVersion/35/g' "$GRADLE_FILE" || true
            sed -i 's/flutter.targetSdkVersion/35/g' "$GRADLE_FILE" || true
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' "$GRADLE_FILE" || true
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' "$GRADLE_FILE" || true
          fi

      - name: Force clean everything before building
        run: |
          flutter clean
          rm -rf ~/.gradle/caches
          rm -rf ~/.pub-cache
          rm -rf .dart_tool
          rm -rf build

      - name: Install Dependencies (fresh)
        run: flutter pub get

      - name: Build Release APK (no cached build artifacts)
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          
