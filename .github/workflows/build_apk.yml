name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK with Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: false

      - name: Replace Old Android Folder with Modern Gradle Structure
        run: |
          # Create a separate temp project to generate a fresh, compatible Android folder
          flutter create temp_project --org com.pdfpoint.app --project-name pdf_point --platforms=android
          
          # Remove the old unsupported android folder from your repo
          rm -rf android
          
          # Bring the fresh, modern android folder into your repo
          mv temp_project/android android
          
          # Clean up temp project
          rm -rf temp_project

      - name: Ensure INTERNET permission and SDK 35
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' "$GRADLE_FILE"
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' "$GRADLE_FILE"
            sed -i 's/flutter.compileSdkVersion/35/g' "$GRADLE_FILE"
            sed -i 's/flutter.targetSdkVersion/35/g' "$GRADLE_FILE"
          fi

      - name: Force clean everything before building
        run: |
          flutter clean
          rm -rf ~/.gradle/caches
          rm -rf ~/.pub-cache
          rm -rf .dart_tool
          rm -rf build

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          
